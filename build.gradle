plugins {
    id 'application'
    id 'distribution'
    id 'java'
    id 'maven-publish'
}

group = 'main'
version = '8.2.0'

description = "A bot for the Facets tabletop RPG"

repositories {
    mavenLocal()
    maven { url "https://jitpack.io" }
    maven { url "https://repo1.maven.org/maven2" }
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation 'org.junit.jupiter:junit-jupiter:5.9.0'
    implementation "org.codehaus.mojo:exec-maven-plugin:3.0.0"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.22.3"
    implementation "org.javacord:javacord:3.8.0"
    implementation "com.google.api-client:google-api-client:1.35.1"
    implementation "com.google.oauth-client:google-oauth-client-jetty:1.34.1"
    implementation "com.google.apis:google-api-services-sheets:v4-rev20220606-1.32.1"
    implementation "org.apache.commons:commons-lang3:3.12.0"
    implementation "com.vdurmont:emoji-java:5.1.1"
    implementation "org.apache.commons:commons-math3:3.6.1"
    implementation 'io.vavr:vavr:0.10.4'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.github.Alan19:Velen:3e73a4b331'
    implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
    implementation "org.apache.logging.log4j:log4j-core:2.26.12.17.2"
    implementation "org.xerial:sqlite-jdbc:3.53.4.0"
    implementation 'org.jgrapht:jgrapht-jdk1.5:0.7.3'
    implementation 'com.io7m.jgrapht:jgrapht-guava:1.2.1-MODULARIZED'
}

distZip {
    into(project.name + "-" + project.version) {
        from '.'
        include 'tokens/*'
        include 'resources/*'
    }
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'discord.TwoDee'
}

compileJava {
    options.encoding = "UTF-8"
}
